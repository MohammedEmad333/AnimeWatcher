name: anime_watcher
description: An anime streaming and tracking app that fetches video links dynamically from a custom backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  
  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Video playback (mp4 + m3u8 / HLS)
  better_player: ^0.0.83

  # WebView playback for iframe/embed sources that aren't direct mp4/hls links
  webview_flutter: ^4.4.4

  # Local database for Favorites / Library (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure storage for the JWT (Cloud Sync / Auth)
  flutter_secure_storage: ^9.2.2

  # Loading placeholders
  shimmer: ^3.0.0

  # Utilities
  cached_network_image: ^3.3.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
